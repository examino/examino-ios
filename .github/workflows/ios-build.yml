name: iOS Build

permissions:
  contents: write

on:
  push:
    branches: [main, master]
    paths:
      - 'Examino/**'
      - 'Examino.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  # ── 模擬器構建(無需簽名,驗證編譯 + 產出 .app)──────────────────────────
  build-simulator:
    name: Build (Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # 動態選擇鏡像上可用的 Xcode(避免硬編碼版本不存在)
          echo "Installed Xcode:"
          ls /Applications | grep -E '^Xcode' || true
          XCODE=$(ls /Applications | grep -E '^Xcode[0-9._]+\.app$' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/$XCODE"
          fi
          xcodebuild -version

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Examino.xcodeproj \
            -scheme Examino \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | tail -80

      - name: Show scheme / target info
        run: |
          xcodebuild -project Examino.xcodeproj -list
        continue-on-error: true

      - name: Upload build log (keep on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: Examino-simulator.app
          path: DerivedData/Build/Products/Debug-iphonesimulator/Examino.app
          if-no-files-found: error

      # 診斷:失敗時把構建日誌寫回倉庫(ci-error.txt),便於無日誌權限時排查
      - name: Report failure log to repo
        if: failure()
        run: |
          head -c 16000 build.log > ci-error.txt 2>/dev/null || true
          git config user.name "ci-bot"
          git config user.email "ci@examino.local"
          git add ci-error.txt
          git commit -q -m "ci: capture build log [skip ci]" || true
          git push -q origin main

  # ── 真機 .ipa(可選:需要 Apple Developer 證書,否則自動跳過)──────────────
  # 啟用方式:Settings → Secrets and variables → Actions → Variables 添加 BUILD_IPA=true
  # 需要的 GitHub Secrets:
  #   IOS_CERT_BASE64       p12 證書的 base64 字串
  #   IOS_CERT_PASSWORD     p12 密碼
  #   IOS_PROVISIONING_B64  ad-hoc 描述檔(.mobileprovision)的 base64
  #   IOS_TEAM_ID           開發者團隊 ID(如 ABCDE12345)
  build-ipa:
    name: Build IPA (Signed)
    runs-on: macos-14
    # job 級 if 不能讀 secrets;改用 repo variable 開關:Settings → Variables → BUILD_IPA=true
    if: ${{ vars.BUILD_IPA == 'true' }}
    needs: build-simulator
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install certificate
        env:
          CERT_B64: ${{ secrets.IOS_CERT_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p examino build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p examino build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/code_sign_injector
          security set-key-partition-list -S apple-tool:,apple: -k examino build.keychain

      - name: Install provisioning profile
        env:
          PROV_B64: ${{ secrets.IOS_PROVISIONING_B64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROV_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/examino.mobileprovision"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild \
            -project Examino.xcodeproj \
            -scheme Examino \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath DerivedData/Examino.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: Export IPA (ad-hoc)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > /tmp/exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath DerivedData/Examino.xcarchive \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath DerivedData/export

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Examino.ipa
          path: DerivedData/export/Examino.ipa
          if-no-files-found: error